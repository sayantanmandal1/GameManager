name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend-build:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  runtime-e2e:
    name: Runtime E2E
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install E2E client dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and start production-like stack
        env:
          DATABASE_PASSWORD: ci_e2e_database_password
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
          CORS_ORIGIN: http://localhost:3000
        run: docker compose -p gameverse-ci up -d --build --wait

      - name: Run REST and Socket.IO E2E
        working-directory: frontend
        env:
          E2E_API_URL: http://127.0.0.1:8000
          E2E_SOCKET_URL: http://127.0.0.1:8000
        run: npm run test:e2e:runtime

      - name: Print service logs on failure
        if: failure()
        env:
          DATABASE_PASSWORD: ci_e2e_database_password
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
          CORS_ORIGIN: http://localhost:3000
        run: docker compose -p gameverse-ci logs --no-color --tail=250

      - name: Tear down E2E stack
        if: always()
        env:
          DATABASE_PASSWORD: ci_e2e_database_password
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
          CORS_ORIGIN: http://localhost:3000
        run: docker compose -p gameverse-ci down -v --remove-orphans
